services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rembuktani-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3131:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - rembuktani-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.hology.eepis.web.id}
    container_name: rembuktani-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:80"
    networks:
      - rembuktani-net
    depends_on:
      - backend

networks:
  rembuktani-net:
    driver: bridge
